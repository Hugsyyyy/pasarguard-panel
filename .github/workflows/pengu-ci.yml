name: Pengu CI

# Checks for the Pengu fork that the upstream workflows do not cover on our branches.
# The full upstream test suite (every database) runs from test-database-migrations.yml.

on:
    push:
        branches: [pengu, "feat/**", "fix/**", "sync/**"]
    pull_request:
        branches: [pengu]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    ruff:
        # Lint (with the locked ruff) only the Python files this fork changed since the upstream
        # release it is based on: upstream's own findings are upstream's to fix.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - name: Install dependencies
              run: make setup-test
            - name: Lint and format check
              run: |
                  git fetch --quiet --tags https://github.com/PasarGuard/panel.git
                  # the upstream final release this branch is based on (never an rc, never our own tags)
                  base=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
                  echo "upstream base: $base"
                  files=$(git diff --name-only --diff-filter=d "$base" HEAD -- '*.py')
                  if [ -z "$files" ]; then echo "no Python changes"; exit 0; fi
                  echo "$files"
                  # --no-fix: pyproject sets fix = true; --force-exclude: honour its excludes (migrations)
                  uv run ruff check --no-fix --force-exclude --output-format=github $files
                  # Format only files whose upstream version is formatted: reformatting upstream code
                  # would only make the next upstream merges conflict.
                  check=""
                  for f in $files; do
                      if git cat-file -e "$base:$f" 2> /dev/null &&
                          ! git show "$base:$f" | uv run ruff format --check --force-exclude --stdin-filename "$f" > /dev/null 2>&1; then
                          echo "skip format check: $f (not formatted upstream)"
                          continue
                      fi
                      check="$check $f"
                  done
                  if [ -n "$check" ]; then uv run ruff format --check --force-exclude $check; fi

    migrations:
        # start.sh runs `alembic upgrade head`, which refuses to start with two heads.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - name: Install dependencies
              run: make setup-test
            - name: Exactly one migration head
              run: |
                  uv run alembic heads | tee heads.txt
                  test "$(grep -c . heads.txt)" -eq 1

    dashboard:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies
              working-directory: ./dashboard
              run: bun install --frozen-lockfile
            - name: Type check
              working-directory: ./dashboard
              run: bun run typecheck
            - name: Build
              run: ./build_dashboard.sh
