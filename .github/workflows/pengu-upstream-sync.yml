name: Pengu upstream sync

# Once a day: if PasarGuard published a release that is not in `pengu` yet, merge it into a
# `sync/<tag>` branch, join the migration heads, open a pull request and run the tests on it.
# A merge conflict opens an issue instead. Nothing is deployed from here.

on:
    schedule:
        - cron: "17 5 * * *"
    workflow_dispatch:
        inputs:
            tag:
                description: "Upstream tag to merge (empty = latest release)"
                required: false

permissions:
    contents: write
    pull-requests: write
    issues: write
    actions: write

concurrency:
    group: upstream-sync

jobs:
    sync:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Checkout pengu
              uses: actions/checkout@v7
              with:
                  ref: pengu
                  fetch-depth: 0

            - name: Find the upstream release
              id: find
              env:
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  tag="$INPUT_TAG"
                  if [ -z "$tag" ]; then
                      tag=$(gh api repos/PasarGuard/panel/releases/latest --jq .tag_name)
                  fi
                  case "$tag" in
                      v[0-9]*) ;;
                      *) echo "unexpected tag '$tag'" >&2; exit 1 ;;
                  esac
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  git remote add upstream https://github.com/PasarGuard/panel.git
                  git fetch --no-tags upstream "refs/tags/$tag:refs/tags/$tag"
                  if git merge-base --is-ancestor "$tag" HEAD; then
                      echo "pengu already contains $tag"
                      echo "state=current" >> "$GITHUB_OUTPUT"
                  elif git ls-remote --exit-code --heads origin "sync/$tag" > /dev/null; then
                      echo "sync/$tag already exists"
                      echo "state=open" >> "$GITHUB_OUTPUT"
                  else
                      echo "state=new" >> "$GITHUB_OUTPUT"
                  fi

            - name: Merge into sync branch
              id: merge
              if: steps.find.outputs.state == 'new'
              env:
                  TAG: ${{ steps.find.outputs.tag }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git checkout -b "sync/$TAG"
                  if git merge --no-ff --no-edit -m "Merge upstream $TAG" "$TAG"; then
                      echo "conflict=0" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  files=$(git diff --name-only --diff-filter=U)
                  git merge --abort
                  body=$(printf 'Merging upstream `%s` into `pengu` conflicts in:\n\n%s\n\nMerge it by hand on a `sync/%s` branch (see PENGU.md).' \
                      "$TAG" "$(echo "$files" | sed 's/^/- `/; s/$/`/')" "$TAG")
                  gh issue create --title "Upstream $TAG needs a manual merge" --body "$body"
                  echo "conflict=1" >> "$GITHUB_OUTPUT"

            - uses: actions/setup-python@v7
              if: steps.merge.outputs.conflict == '0'
              with:
                  python-version: "3.14"

            - name: Join migration heads
              if: steps.merge.outputs.conflict == '0'
              env:
                  TAG: ${{ steps.find.outputs.tag }}
              run: |
                  make setup-test
                  uv run alembic heads | tee heads.txt
                  if [ "$(grep -c . heads.txt)" -gt 1 ]; then
                      rev="pengu_merge_$(echo "$TAG" | tr -cd '0-9')"
                      uv run alembic merge heads -m "pengu merge upstream $TAG" --rev-id "$rev"
                      git add app/db/migrations/versions
                      git commit -m "chore(db): join upstream $TAG migrations with the fork's"
                  fi
                  rm -f heads.txt

            - name: Push, open the pull request and run the tests
              if: steps.merge.outputs.conflict == '0'
              env:
                  TAG: ${{ steps.find.outputs.tag }}
              run: |
                  git push origin "sync/$TAG"
                  body=$(printf 'Upstream release [%s](https://github.com/PasarGuard/panel/releases/tag/%s) merged into `pengu`.\n\nBefore merging: the tests below must pass, then tag `%s-pengu.1` to build the image (see PENGU.md).' "$TAG" "$TAG" "$TAG")
                  gh pr create --base pengu --head "sync/$TAG" --title "Sync upstream $TAG" --body "$body"
                  # Pushes and PRs made with GITHUB_TOKEN do not start other workflows; dispatches do.
                  gh workflow run pengu-ci.yml --ref "sync/$TAG"
                  gh workflow run test-database-migrations.yml --ref "sync/$TAG"
